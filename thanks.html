<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Abhishek Abraham T A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 50%, #f0f2ff 100%);
      color: #1a1a1a;
      overflow: hidden;
      position: relative;
    }

    /* Floating background shapes */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.06;
      background: #6c63ff;
      animation: float-drift 20s ease-in-out infinite;
    }
    .bg-shape-1 { width: 300px; height: 300px; top: -80px; left: -60px; }
    .bg-shape-2 { width: 200px; height: 200px; bottom: -40px; right: -40px; animation-delay: 5s; animation-direction: reverse; }
    .bg-shape-3 { width: 150px; height: 150px; top: 30%; right: 10%; animation-delay: 10s; }
    @keyframes float-drift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(20px, -20px); }
      50% { transform: translate(-15px, 15px); }
      75% { transform: translate(10px, 5px); }
    }

    /* Main card */
    .thank-you-card {
      text-align: center;
      max-width: 520px;
      padding: 60px 48px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 32px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08);
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      animation: card-appear 0.8s ease 0.2s forwards;
    }
    @keyframes card-appear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Checkmark */
    .check-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #8b83ff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 8px 28px rgba(108, 99, 255, 0.3);
      opacity: 0;
      transform: scale(0);
      animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards;
    }
    @keyframes pop-in {
      to { opacity: 1; transform: scale(1); }
    }
    .check-circle svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: draw-check 0.6s ease 1s forwards;
    }
    @keyframes draw-check {
      to { stroke-dashoffset: 0; }
    }

    .thank-you-card h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      opacity: 0;
      animation: fade-in-up 0.6s ease 0.8s forwards;
    }
    .thank-you-card p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 36px;
      opacity: 0;
      animation: fade-in-up 0.6s ease 1s forwards;
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-links {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fade-in-up 0.6s ease 1.2s forwards;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .back-link-primary {
      background: #6c63ff;
      color: #fff;
      box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
    }
    .back-link-primary:hover {
      background: #5a52e0;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.35);
    }
    .back-link-secondary {
      background: rgba(0, 0, 0, 0.04);
      color: #1a1a1a;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .back-link-secondary:hover {
      border-color: #6c63ff;
      color: #6c63ff;
      transform: translateY(-2px);
    }

    @media (max-width: 560px) {
      .thank-you-card { margin: 20px; padding: 40px 28px; }
      .thank-you-card h1 { font-size: 1.4rem; }
      .thank-you-card p { font-size: 1rem; }
      .back-links { flex-direction: column; }
      .back-link { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>

  <div class="thank-you-card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24"><polyline points="6 12 10 16 18 8"></polyline></svg>
    </div>
    <h1>Message Sent!</h1>
    <p>Got it! Thanks for contacting me&mdash;I'll reply soon.</p>
    <div class="back-links">
      <a href="index.html" class="back-link back-link-primary">&larr; Back to Home</a>
      <a href="premium.html" class="back-link back-link-secondary">Premium Portfolio</a>
    </div>
  </div>
</body>
</html>
